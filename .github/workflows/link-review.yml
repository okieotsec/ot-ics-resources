name: Manual link review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Create review report
        run: python scripts/check_links.py
      - name: Publish findings in job summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('reports/link-review.json').read_text())
          findings = [x for x in report['results'] if x['result'] != 'reachable']
          print('## Resource links requiring review')
          print(report['note'])
          print()
          for item in findings:
              print('- ' + item['result'] + ': ' + item['url'])
          if not findings:
              print('No HTTP/network review candidates in this run.')
          PY
