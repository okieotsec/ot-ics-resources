name: Suggest a resource
description: Recommend an accessible OT/ICS resource
title: '[Resource] '
body:
  - type: input
    id: title
    attributes:
      label: Resource title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official source URL
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: What does it provide, and who is it for?
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: Access
      options:
        - Free public resource
        - Free with registration, eligibility or limitations
        - Affordable paid resource
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Cost, currency, billing period and access requirements
      description: Include account/form requirements and hardware or software costs where relevant.
    validations:
      required: true
  - type: input
    id: reviewed
    attributes:
      label: Date checked
      placeholder: YYYY-MM-DD
